name: 定投提醒

on:
  # 工作日早上 9:00 北京时间 (= 1:00 UTC)
  schedule:
    - cron: '0 1 * * 1-5'
  # 允许手动触发
  workflow_dispatch:

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 拉取指数 + 计算 MA + 发飞书
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: python feishu_alert.py
